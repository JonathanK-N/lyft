{% extends "base.html" %}
{% block content %}

<h2>Inscription</h2>
<form method="post" class="mb-4">
  <div class="mb-2">
    <input class="form-control" name="name" placeholder="Nom" required>
  </div>
  <div class="mb-2">
    <input class="form-control" name="address" placeholder="Adresse complète" required>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="has_vehicle" id="has_vehicle">
    <label class="form-check-label" for="has_vehicle">J’ai un véhicule</label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="can_drive" id="can_drive">
    <label class="form-check-label" for="can_drive">Je peux donner un Lyft</label>
  </div>
  <div class="mb-2">
    <input class="form-control" type="number" name="capacity" placeholder="Places disponibles (si conducteur)">
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="wants_ride" id="wants_ride">
    <label class="form-check-label" for="wants_ride">J’ai besoin d’un Lyft</label>
  </div>
  <button class="btn btn-primary" type="submit">S’inscrire</button>
</form>

<h2>Membres inscrits</h2>
<ul class="list-group">
  {% for m in membres %}
  <li class="list-group-item">
    {{ m.name }} – {{ m.address }}
    {% if m.can_drive %}
      <a href="{{ url_for('driver_view', member_id=m.id) }}" class="btn btn-sm btn-success">Espace Conducteur</a>
    {% elif m.wants_ride %}
      <a href="{{ url_for('passenger_view', member_id=m.id) }}" class="btn btn-sm btn-info">Espace Passager</a>
    {% endif %}
  </li>
  {% endfor %}
</ul>

{% endblock %}
