{% extends 'base.html' %}
{% block title %}Passager – Church Lyft{% endblock %}
{% block content %}
<div class="container">
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Demander une navette</h2>
          <div class="mb-3">
            <label class="form-label">Point de départ</label>
            <div class="input-group">
              <input id="pickup" class="form-control" placeholder="Ma position ou adresse" />
              <button class="btn btn-outline-secondary" id="btnPickupHere"><i class="bi bi-geo"></i></button>
            </div>
            <div class="position-relative mt-2">
              <input id="addrSearch" class="form-control" placeholder="Rechercher une adresse (ex: 219 Rue Queen)" />
              <div id="addrResults" class="list-group position-absolute w-100" style="z-index:1050;"></div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Destination</label>
            <input id="dropoff" class="form-control" placeholder="Église ICC Sherbrooke ou autre" />
          </div>
          <button class="btn btn-primary w-100" id="btnRequest"><i class="bi bi-send"></i> Demander</button>
          <div class="form-text mt-2">Un chauffeur proche vous sera proposé.</div>
        </div>
      </div>
      <div class="alert alert-info mt-3" role="alert">
        <i class="bi bi-info-circle me-1"></i> Conseil: autorisez la géolocalisation pour une meilleure précision.
      </div>
    </div>
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="ratio ratio-4x3">
          <div id="map-passenger"></div>
        </div>
        <div class="card-body d-flex gap-2 flex-wrap">
          <button class="btn btn-outline-primary" id="btnMyPosition"><i class="bi bi-crosshair"></i> Ma position</button>
          <button class="btn btn-outline-secondary" id="btnClear"><i class="bi bi-eraser"></i> Effacer</button>
          <button class="btn btn-outline-secondary" id="btnChurch"><i class="bi bi-geo-alt"></i> Église</button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  AppMap.setFallbackCenter({{ church_lat|tojson }}, {{ church_lon|tojson }});
  const map = AppMap.create('map-passenger', { center: [{{ church_lat }}, {{ church_lon }}], zoom: 13 });
  AppMap.locateAndCenter().catch(() => {});

  document.getElementById('btnPickupHere').addEventListener('click', async () => {
    const pos = await AppMap.locate();
    if (pos) {
      AppMap.addOrMoveMarker('pickup', pos, { label: 'Départ' });
      document.getElementById('pickup').value = `${pos[0].toFixed(5)}, ${pos[1].toFixed(5)}`;
      try { await Auth.fetch('/passenger/location', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ lat: pos[0], lon: pos[1] }) }); } catch(_){}
    }
  });

  document.getElementById('btnMyPosition').addEventListener('click', AppMap.locateAndCenter);
  document.getElementById('btnClear').addEventListener('click', () => AppMap.clearRoute());
  document.getElementById('btnChurch').addEventListener('click', ()=> map.setView([{{ church_lat }}, {{ church_lon }}], 15));

  // Address search via Nominatim
  const addr = document.getElementById('addrSearch');
  const results = document.getElementById('addrResults');
  let searchTimer=null;
  addr.addEventListener('input', ()=>{
    const q = addr.value.trim(); results.innerHTML='';
    if (searchTimer) clearTimeout(searchTimer);
    if (q.length < 3) return;
    searchTimer = setTimeout(async ()=>{
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&addressdetails=1&limit=5`;
        const res = await fetch(url, { headers: { 'Accept': 'application/json' }});
        const data = await res.json(); results.innerHTML='';
        (data||[]).forEach(it=>{
          const a = document.createElement('a');
          a.href='#'; a.className='list-group-item list-group-item-action';
          a.textContent = it.display_name;
          a.addEventListener('click', async (e)=>{
            e.preventDefault(); results.innerHTML=''; addr.value = it.display_name;
            const lat = parseFloat(it.lat), lon=parseFloat(it.lon);
            AppMap.addOrMoveMarker('pickup', [lat, lon], { label: 'Départ' });
            map.setView([lat,lon], 15);
            document.getElementById('pickup').value = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
            try { await Auth.fetch('/passenger/location', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ lat, lon }) }); } catch(_){}
          });
          results.appendChild(a);
        });
      } catch(_){ results.innerHTML=''; }
    }, 400);
  });

  document.getElementById('btnRequest').addEventListener('click', () => {
    (async () => {
      try {
        // utilise la position courante si possible
        let platlng = null;
        try { platlng = await AppMap.locate(); } catch(_) {}
        const body = platlng ? { pickup_lat: platlng[0], pickup_lon: platlng[1] } : {};
        const res = await Auth.fetch('/passenger/request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await Auth.json(res);
        const ok = res.ok;
        const msg = ok ? 'Demande envoyée, en attente d\'un chauffeur proche…' : (data.error || 'Erreur');
        const el = document.createElement('div');
        el.className = `toast align-items-center text-bg-${ok?'success':'danger'} border-0 show position-fixed bottom-0 end-0 m-3`;
        el.innerHTML = `<div class=\"d-flex\"><div class=\"toast-body\">${msg}</div><button type=\"button\" class=\"btn-close btn-close-white me-2 m-auto\" data-bs-dismiss=\"toast\"></button></div>`;
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 5000);
      } catch (e) {
        const el = document.createElement('div');
        el.className = 'toast align-items-center text-bg-danger border-0 show position-fixed bottom-0 end-0 m-3';
        el.innerHTML = `<div class=\"d-flex\"><div class=\"toast-body\">${e.message||'Erreur'}</div><button type=\"button\" class=\"btn-close btn-close-white me-2 m-auto\" data-bs-dismiss=\"toast\"></button></div>`;
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 5000);
      }
    })();
  });

  // Notify passenger when a driver accepts
  document.addEventListener('request:accepted', (ev) => {
    const d = ev.detail || {}; const me = (window.AppSocket||{}).me;
    if (!me || d.passenger_id !== me.id) return;
    const el = document.createElement('div');
    el.className = 'toast align-items-center text-bg-success border-0 show position-fixed bottom-0 end-0 m-3';
    el.innerHTML = `<div class="d-flex"><div class="toast-body">${d.driver?.name||'Un chauffeur'} a accepté votre demande.</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
    document.body.appendChild(el); setTimeout(()=>el.remove(), 6000);
  });
</script>
{% endblock %}
